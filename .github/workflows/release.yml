name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare signing and build configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          umask 077
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          required = (
              'ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD',
              'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD',
              'SUPABASE_URL', 'SUPABASE_PUBLISHABLE_KEY',
          )
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Required release secrets are missing')
          keystore = Path(os.environ['RUNNER_TEMP']) / 'release-keystore.jks'
          keystore.write_bytes(base64.b64decode(
              os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))

          # Escape Java Properties syntax, including Unicode and punctuation.
          def escape(value):
              return ''.join('\\u%04x' % int.from_bytes(value[i:i + 2], 'big')
                             for i in range(0, len(value), 2))

          values = {
              'storeFile': str(keystore),
              'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
          }
          Path('android/key.properties').write_text(''.join(
              key + '=' + escape(value.encode('utf-16-be')) + '\n'
              for key, value in values.items()))
          # JSON is accepted by --dart-define-from-file regardless of extension.
          Path('.env').write_text(json.dumps({
              'SUPABASE_URL': os.environ['SUPABASE_URL'],
              'SUPABASE_PUBLISHABLE_KEY': os.environ['SUPABASE_PUBLISHABLE_KEY'],
          }))
          PY
      - name: Build signed APK
        run: flutter build apk --release --dart-define-from-file=.env
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
      - name: Remove signing and build configuration
        if: always()
        shell: bash
        run: rm -f android/key.properties .env "$RUNNER_TEMP/release-keystore.jks"
