<!doctype html>
<!-- Google Play feature graphic, 1024 x 500. Rendered by render.mjs ({{FONTS}}, {{FG}} are filled in).
     #cs (default) and #en switch the copy. Colours follow lib/app_theme.dart. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Raleway; src: url('{{FONTS}}/Raleway-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: Raleway; src: url('{{FONTS}}/Raleway-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: Plex; src: url('{{FONTS}}/IBMPlexMono-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: Plex; src: url('{{FONTS}}/IBMPlexMono-Bold.ttf'); font-weight: 700; }
  :root {
    --espresso: #35241D; --roast: #6D4938; --caramel: #C2865D;
    --crema: #F4E9DE; --foam: #FFFBF7; --sage: #607466;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body { background: var(--crema); font-family: Raleway, sans-serif; color: var(--espresso); position: relative; }
  .stage { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 76px 0 84px; gap: 56px; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
  .brand img { width: 128px; height: 128px; margin: -30px -26px -30px -34px; }
  .brand span { font-weight: 700; font-size: 46px; letter-spacing: -0.5px; }
  h1 { font-weight: 700; font-size: 44px; line-height: 1.12; letter-spacing: -0.6px; max-width: 470px; }
  .note { margin-top: 22px; font-family: Plex, monospace; font-size: 15px; letter-spacing: 0.4px; color: var(--roast); }
  /* Widget-like CAF card */
  .card { width: 318px; background: var(--foam); border-radius: 30px; padding: 30px 30px 26px;
          border: 1.5px solid rgba(109, 73, 56, 0.12); box-shadow: 0 18px 40px -18px rgba(53, 36, 29, 0.35); }
  .eyebrow { font-family: Plex, monospace; font-weight: 700; font-size: 13px; letter-spacing: 1.6px; color: var(--roast); }
  .ringrow { display: flex; align-items: center; gap: 22px; margin: 18px 0 20px; }
  .ring { width: 118px; height: 118px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Plex, monospace; font-size: 30px; }
  .ring b small { font-size: 16px; margin-left: 2px; }
  .time { font-family: Plex, monospace; font-weight: 700; font-size: 30px; line-height: 1; }
  .time-label { font-size: 15px; color: var(--roast); margin-top: 8px; }
  .btn { display: block; text-align: center; background: var(--espresso); color: #fff; border-radius: 18px;
         padding: 14px 0; font-weight: 700; font-size: 18px; }
  [data-en] { display: none; }
  body.en [data-en] { display: block; }
  body.en [data-cs] { display: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="brand"><img src="{{FG}}" alt=""><span>CaffAlert</span></div>
    <h1 data-cs>Kávu zapíšeš jedním klepnutím. Zbytek odpočítá CAF.</h1>
    <h1 data-en>Log a coffee in one tap. CAF counts down the rest.</h1>
    <p class="note" data-cs>CAF je hra, ne měření kofeinu.</p>
    <p class="note" data-en>CAF is a game, not a caffeine measurement.</p>
  </div>
  <div class="card">
    <div class="eyebrow" data-cs>CAF ÚROVEŇ</div>
    <div class="eyebrow" data-en>CAF LEVEL</div>
    <div class="ringrow">
      <div class="ring">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#C2865D" stroke-opacity="0.22" stroke-width="13"/>
          <circle cx="60" cy="60" r="50" fill="none" stroke="#6D4938" stroke-width="13" stroke-linecap="round"
                  stroke-dasharray="235.6 314.2"/>
        </svg>
        <b>75<small>%</small></b>
      </div>
      <div>
        <div class="time">2:59</div>
        <div class="time-label" data-cs>do nuly</div>
        <div class="time-label" data-en>to zero</div>
      </div>
    </div>
    <span class="btn" data-cs>+ Káva</span>
    <span class="btn" data-en>+ Coffee</span>
  </div>
</div>
<script>if (location.hash === '#en') document.body.classList.add('en');</script>
</body>
</html>
